# Settings for a deployed server. Activate with SPRING_PROFILES_ACTIVE=prod.
#
# Everything here is a default that is wrong outside a laptop. The base
# application.properties stays convenient for development on purpose; this file
# is the set of things that have to change when the server stops being one.

# --- Seeding ----------------------------------------------------------------
# No demo accounts. Without this, 'admin', 'john' and eight others exist with the
# password 'password' - on a public server that is not a seed, it is a way in.
#
# An admin is still created if ADMIN_PASSWORD is set, and not otherwise. See
# Startup: a missing admin is recoverable with one UPDATE, a guessable one is not.
betsocial.dev-seed=false
betsocial.admin-password=${ADMIN_PASSWORD:}
betsocial.sample-data=false

# --- Session cookie ---------------------------------------------------------
# Secure means the cookie is never sent over plain HTTP, which is what stops it
# being readable by anybody on the same network. It requires HTTPS to be in
# front of this - see the deployment section of the README.
#
# The WebSocket handshake carries this cookie too, so with Secure on, the socket
# must be wss:// rather than ws://.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# --- Behind a reverse proxy -------------------------------------------------
# TLS terminates at the proxy, so without this the application believes every
# request arrived over plain HTTP on its own port, and writes redirect and cookie
# headers that say so.
server.forward-headers-strategy=framework

# --- Error responses --------------------------------------------------------
# These now only govern the /error dispatch - anything that fails outside a
# controller, in a filter, before the advice can see it. ApiErrorHandler makes
# the distinction that matters for the API itself: a reason somebody wrote for a
# person to read is passed through, and a library's description of its own
# insides is not, in every environment rather than only this one.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# --- Schema -----------------------------------------------------------------
# A deployed database is either empty and built by Flyway from V1, or already
# under Flyway's management. Adopting an unknown schema by assuming it is at V1
# is a development convenience and a way to silently skip migrations here.
spring.flyway.baseline-on-migrate=false

# --- Logging ----------------------------------------------------------------
# JSON, because these lines are going to something that indexes them rather than
# to somebody reading a terminal. ecs is the common-denominator format.
logging.structured.format.console=${LOG_FORMAT:ecs}
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.messaging=INFO
