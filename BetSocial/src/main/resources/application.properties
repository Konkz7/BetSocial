spring.application.name=World

# --- Datasource -------------------------------------------------------------
# All values come from the environment. See .env.example for the full list.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.generate-unique-name=false
spring.datasource.name=world
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Schema migrations ------------------------------------------------------
# Flyway owns the schema (src/main/resources/db/migration).
# baseline-on-migrate lets Flyway adopt a database that already has the tables
# (e.g. an existing local dev database) by marking it as being at V1 instead of
# trying to re-create them.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# --- Error responses --------------------------------------------------------
# NOTE: the prefix is server.error.*, not spring.server.error.* - the previous
# spelling was silently ignored.
server.error.include-message=always
server.error.include-binding-errors=always

logging.level.org.springframework.security=DEBUG

# --- Firebase ---------------------------------------------------------------
# Credentials are resolved as a Spring resource, so this works both from the IDE
# and from a packaged jar. Default is the classpath copy; override with e.g.
# FIREBASE_CREDENTIALS=file:/etc/betsocial/firebaseAPI.json in deployment.
firebase.credentials=${FIREBASE_CREDENTIALS:classpath:firebaseAPI.json}
firebase.database-url=${FIREBASE_DB_URL:https://betsocial-e7e93-default-rtdb.europe-west1.firebasedatabase.app}

# --- Mail -------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
