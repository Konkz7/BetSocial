spring.application.name=World

# --- Datasource -------------------------------------------------------------
# All values come from the environment. See .env.example for the full list.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.generate-unique-name=false
spring.datasource.name=world
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Schema migrations ------------------------------------------------------
# Flyway owns the schema (src/main/resources/db/migration).
# baseline-on-migrate lets Flyway adopt a database that already has the tables
# (e.g. an existing local dev database) by marking it as being at V1 instead of
# trying to re-create them.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# --- Error responses --------------------------------------------------------
# NOTE: the prefix is server.error.*, not spring.server.error.* - the previous
# spelling was silently ignored.
server.error.include-message=always
server.error.include-binding-errors=always

# --- Logging ----------------------------------------------------------------
# Spring Security at DEBUG was writing the whole SecurityContext - principal,
# authorities, session id - on every single request. That is thousands of lines
# an hour saying nothing, and it buries the lines that matter. INFO here; raise
# it deliberately when chasing an authorisation problem.
logging.level.org.springframework.security=INFO
logging.level.com.example.World=INFO

# The request id and user from LogContextFilter, on every line. Without them
# a log is a list of sentences with no way to tell which belong to one request.
# Empty brackets when there is no request in progress - a scheduled sweep, or
# startup - which is itself worth being able to see.
logging.pattern.level=%5p [%X{requestId:-}/%X{userId:-}]

# JSON for anything that ships logs somewhere. Off by default because a human
# reading a terminal wants the readable format, and on in deployment because a
# log aggregator wants fields rather than a sentence to re-parse. Spring Boot
# 3.4 does this natively, so there is no encoder dependency to add.
#   LOG_FORMAT=ecs   (Elastic), logstash, or gelf
logging.structured.format.console=${LOG_FORMAT:}

# --- Firebase ---------------------------------------------------------------
# Credentials are resolved as a Spring resource, so this works both from the IDE
# and from a packaged jar. Default is the classpath copy; override with e.g.
# FIREBASE_CREDENTIALS=file:/etc/betsocial/firebaseAPI.json in deployment.
firebase.credentials=${FIREBASE_CREDENTIALS:classpath:firebaseAPI.json}
firebase.database-url=${FIREBASE_DB_URL:https://betsocial-e7e93-default-rtdb.europe-west1.firebasedatabase.app}

# --- Mail -------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Development sample data ------------------------------------------------
# Off unless asked for. When on, SampleData tops the database up to enough
# threads, messages and accounts to actually see pagination work - a page
# boundary does not exist with eleven users and four threads.
#   SAMPLE_DATA=true ./mvnw spring-boot:run
betsocial.sample-data=${SAMPLE_DATA:false}

# --- Media -------------------------------------------------------------------
# The Firebase Storage bucket the app uploads to, e.g. betsocial-e7e93.appspot.com
# (Firebase console > Storage). Media URLs are only accepted if they name an
# object in this bucket, and removing a thread or message deletes the object.
#
# Blank disables both: references are accepted unchecked and nothing is deleted.
# That is the wrong setting anywhere real - see the Media section of the README.
firebase.storage-bucket=${FIREBASE_STORAGE_BUCKET:}
