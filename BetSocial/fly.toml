# Fly.io deployment. Run `fly deploy` from this directory.
#
# The app name has to be unique across Fly, so `fly launch --no-deploy` will
# rename it if this one is taken - let it.

app = "betsocial"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  # Not a secret, and needed before any secret is read. The Dockerfile sets this
  # too; having it here means `fly deploy` cannot be talked out of it by an
  # image built somewhere else.
  SPRING_PROFILES_ACTIVE = "prod"
  PORT = "8080"

[http_service]
  internal_port = 8080

  # The session cookie is marked Secure in the prod profile, so it is never sent
  # over plain HTTP. Without this redirect the app would simply fail to
  # authenticate anyone arriving on http:// - including the WebSocket handshake,
  # which carries the same cookie.
  force_https = true

  # Off. This application holds WebSocket connections open for as long as a chat
  # screen is on-screen, and a stopped machine is a dropped socket for everybody
  # connected to it. Also: scheduled work - closing expired bets, evicting rate
  # limit buckets - does not run on a machine that has been stopped.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    # WebSockets are long-lived, so the limit here is "how many people can have a
    # chat open", not "how many requests at once". Low numbers would queue people
    # out of the app while the server sat idle.
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  # Asks the database, so a machine that cannot read anything stops being sent
  # traffic instead of serving errors. See HealthController.
  interval = "15s"
  timeout = "4s"
  grace_period = "45s"
  method = "GET"
  path = "/health"

[[vm]]
  # 512MB is the smallest this runs in with room to spare. The Firebase Admin
  # SDK and its gRPC stack are most of the footprint, and the JVM is told to use
  # 75% of whatever it is given - see JAVA_OPTS in the Dockerfile.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Deliberately no [[mounts]]. Nothing is written to disk: media goes to Firebase
# Storage, and everything else is in Postgres. A machine here is disposable, and
# a volume would quietly make it not.
